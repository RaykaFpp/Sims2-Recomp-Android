plugins {
    id 'com.android.application'
}

android {
    namespace 'org.sims2recomp'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'org.sims2recomp.sims2'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release',
                        "-DXBE_HOST_TOOLS_DIR=${file('../../out/build/host-tools').absolutePath}"
                cppFlags '-std=c++20'
                targets 'main'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.25.0+'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

}

dependencies {
    implementation files('libs/SDL3-3.4.16.aar')
}
